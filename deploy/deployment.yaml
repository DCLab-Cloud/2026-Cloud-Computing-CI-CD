apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-web
  namespace: k8s-cicd-lab
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cicd-web
  template:
    metadata:
      labels:
        app: cicd-web
    spec:
      containers:
        - name: web
          image: ghcr.io/dclab-cloud/2026-cloud-computing-ci-cd@sha256:828b5c8cd7e2c00be88e63ae5b8f64fe6ba6d7844a00cc59845b5afdfd80f303
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
