name: CI - Check and Publish

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      APP_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: python -m pip install -r app/requirements.txt

      - name: Python 문법 확인
        run: python -m py_compile app/app.py

      - name: 웹 앱 기동
        run: |
          gunicorn \
            --chdir app \
            --bind 127.0.0.1:8000 \
            --workers 1 \
            --threads 2 \
            --daemon \
            --pid "$RUNNER_TEMP/cicd-web.pid" \
            --error-logfile "$RUNNER_TEMP/cicd-web.log" \
            app:app

      - name: CLI로 HTTP 응답 확인
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8000/healthz

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/version

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/

      - name: 웹 앱 종료
        if: always()
        run: test ! -f "$RUNNER_TEMP/cicd-web.pid" || kill "$(cat "$RUNNER_TEMP/cicd-web.pid")"

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: GHCR 로그인
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: 웹 이미지 빌드·게시
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "소스 커밋: $GITHUB_SHA"
          echo "이미지 태그: $IMAGE:sha-$GITHUB_SHA"

          docker build \
            --build-arg APP_COMMIT="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            ./app

          docker push "$IMAGE:sha-$GITHUB_SHA"
